version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spareparts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spareuser
      POSTGRES_PASSWORD: sparepass
      POSTGRES_DB: spareparts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spareuser -d spareparts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (task queue / YouTube cache) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: spareparts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── pgAdmin (optional DB UI) ─────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spareparts_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spareparts.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # Only start with: docker-compose --profile tools up

volumes:
  postgres_data:
  redis_data:
